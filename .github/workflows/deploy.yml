name: deploy

# The landing page and the docs, on Cloudflare as a Worker with static assets.
#
# A push to main and a pull request only build, so a broken page shows before
# a release. A v* tag publishes: the Tag workflow calls this one with the tag
# it pushed (a tag(patch|minor|major): commit), and a tag pushed by hand
# (make tag patch) starts it on its own. `workflow_dispatch` is the manual
# button, for a redeploy with no change.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag to publish
        required: true
        type: string

# One deploy at a time, and never cancel one in flight: wrangler uploading a
# half-finished set of files is worse than waiting.
concurrency:
  group: deploy-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # pnpm before Node: the pnpm cache of setup-node needs pnpm, and pnpm
      # reads its version from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `output: 'export'` writes a static site to out/.
      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare
        if: inputs.ref != '' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # The token needs Account > Workers Scripts: Edit and
          # Zone > Workers Routes: Edit on clowk.in.
          command: deploy
